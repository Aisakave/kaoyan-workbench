<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f7cf7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101319">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f7cf7'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E考%3C/text%3E%3C/svg%3E">
  <title>考研备考工作台</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-badge">考</div>
        <span class="brand-title">备考工作台</span>
      </div>
      <nav class="sidebar-nav" id="sideNav">
        <!-- 桌面/平板 导航项由 JS 渲染 -->
      </nav>
      <div class="sidebar-footer">
        <div id="themeToggleDesktop" class="tt-slot" title="点击切换浅色/深色外观"></div>
        <button class="btn btn-ghost btn-full" id="btnExport" title="导出备份">导出数据</button>
        <button class="btn btn-ghost btn-full" id="btnImport" title="导入备份">导入备份</button>
      </div>
    </aside>
    <div class="sidebar-mask" id="sidebarMask" aria-hidden="true"></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="btn btn-icon sidebar-toggle" id="btnToggleSide" aria-label="菜单"><svg class="ico-svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"></use></svg></button>
        <h1 class="topbar-title" id="pageTitle">首页</h1>
        <div class="topbar-actions">
          <span class="countdown-pill" id="topCountdown"></span>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <input type="file" id="fileImport" accept=".json,.jsonl,application/json" style="display:none">
  <div class="modal-mask" id="modalMask" hidden></div>
  <div class="toast" id="toast"></div>
